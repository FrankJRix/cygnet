[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cygnet-physics"
version = "0.1.0"
description = "Physics-aware segmentation and pixel selection for CYGNO detector images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "torch>=2.2,<3", "torchvision>=0.17,<1",
  "uproot>=5,<6", "matplotlib>=3.8,<4", "imageio>=2.34,<3", "pillow>=10",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6", "nbformat>=5", "nbclient>=0.10"]

[tool.setuptools]
py-modules = ["cygnet"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
